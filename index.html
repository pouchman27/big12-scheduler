<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Big 12 Quadrant Scheduler</title>
<style>
:root{--bg:#0f1420;--card:#192033;--ink:#eef2fb;--mut:#93a0bd;--a:#f5b700;--b:#4cc3ff}
*{box-sizing:border-box}body{margin:0;font:15px/1.4 system-ui,sans-serif;background:var(--bg);color:var(--ink)}
header{padding:22px 16px 6px;text-align:center}h1{margin:0;font-size:26px}header p{color:var(--mut);margin:6px 0 0}
main{max-width:1000px;margin:auto;padding:12px 14px 50px}
.bar{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:14px 0}
button,select{background:var(--card);color:var(--ink);border:1px solid #2c3858;border-radius:9px;padding:10px 14px;font:inherit;cursor:pointer}
button.p{background:var(--a);color:#111;border:0;font-weight:700}button:hover{filter:brightness(1.15)}
.quads{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px}
.q{background:var(--card);border-radius:12px;padding:12px;border-top:4px solid #555}
.q h3{margin:0 0 6px;font-size:14px;color:var(--mut);text-transform:uppercase;letter-spacing:.05em}
.q div.t{padding:3px 0}
.divs{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.d{border-radius:12px;padding:12px;background:var(--card)}.d.A{border-left:5px solid var(--a)}.d.B{border-left:5px solid var(--b)}
.d h2{margin:0 0 6px;font-size:17px}.d small{color:var(--mut)}
h2.s{margin:26px 0 8px}
.wk{background:var(--card);border-radius:12px;padding:10px 12px;margin-bottom:8px}
.wk.fin{outline:2px solid var(--a)}
.wk h4{margin:0 0 6px}.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:4px 14px}
.g span{display:flex;justify-content:space-between;gap:8px}.g b.A{color:var(--a)}.g b.B{color:var(--b)}
.sc{color:var(--mut);font-variant-numeric:tabular-nums}
table{width:100%;border-collapse:collapse}td,th{padding:4px 6px;text-align:left}th{color:var(--mut);font-weight:500}
.tw{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:640px){.divs,.tw{grid-template-columns:1fr}}
.q .t.e{cursor:pointer;border-radius:6px;padding:5px 8px;margin:2px 0;background:#232c45;touch-action:manipulation}.q .t.e:hover{background:#2c3858}.q .t.sel{background:var(--a);color:#111;font-weight:700}.q h3 .ren{cursor:pointer;text-decoration:underline dotted}.hint{background:var(--card);border:1px dashed var(--a);border-radius:10px;padding:8px 12px;margin:0 0 10px;text-align:center;color:var(--mut)}
.note{color:var(--mut);font-size:13px;text-align:center}
</style></head><body>
<header><h1>Big 12 Quadrant Scheduler</h1><p>16 teams, 4 quadrants, 2 divisions, one randomized mock season.</p></header>
<main>
<div class="bar">
<button class="p" id="sched">Randomize schedule</button>
<button id="redraw">Redraw quadrants (random)</button>
<button id="edit">Edit quadrants</button>
<button id="geo">Reset to geographic</button>
<select id="pair"></select>
<button id="sim">Simulate scores</button>
</div>
<div id="hint"></div>
<div class="quads" id="quads"></div>
<div class="divs" id="divs"></div>
<h2 class="s">Mock schedule</h2><div id="weeks"></div>
<div id="stand"></div>
<p class="note">Weeks 1-7: every team plays its division once, in random order. Week 8: the two divisions face each other. Team list: 2026 Big 12 membership.</p>
</main>
<script>
const GEO=[["Mountain & Desert",["Arizona","Arizona State","Utah","BYU"]],
["Texas",["Baylor","TCU","Houston","Texas Tech"]],
["Plains",["Colorado","Kansas","Kansas State","Iowa State"]],
["East & Sooner",["Oklahoma State","Cincinnati","UCF","West Virginia"]]];
const PAIRS=[[[0,2],[1,3]],[[0,1],[2,3]],[[0,3],[1,2]]];
const COL=["#e0a030","#d9534f","#5cb85c","#4cc3ff"];
let Q=GEO.map(q=>({name:q[0],teams:q[1].slice()})),pairIdx=0,sched=null,scores=null,editing=false,picked=null;
const KEY="big12-quadrants-v1",ALL=GEO.flatMap(q=>q[1]);
function save(){try{localStorage.setItem(KEY,JSON.stringify({Q,pairIdx}))}catch(e){}}
function load(){try{const d=JSON.parse(localStorage.getItem(KEY));if(!d||!Array.isArray(d.Q)||d.Q.length!=4)return;const flat=d.Q.flatMap(q=>q.teams);if(d.Q.some(q=>q.teams.length!=4)||flat.length!=16||ALL.some(t=>!flat.includes(t)))return;Q=d.Q.map(q=>({name:String(q.name).slice(0,30),teams:q.teams.slice()}));pairIdx=[0,1,2].includes(d.pairIdx)?d.pairIdx:0}catch(e){}}
function swap(a,b){let ia,ta,ib,tb;Q.forEach((q,i)=>q.teams.forEach((t,j)=>{if(t==a){ia=i;ta=j}if(t==b){ib=i;tb=j}}));Q[ia].teams[ta]=b;Q[ib].teams[tb]=a}
function pick(t){if(picked==null){picked=t;render();return}if(picked!=t){swap(picked,t);picked=null;save();fillSel();build();return}picked=null;render()}
const $=id=>document.getElementById(id);
const shuf=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const sel=$("pair");
function names(){return PAIRS.map(p=>p.map(d=>d.map(i=>Q[i].name).join(" + ")).join("  vs  "))}
function fillSel(){sel.innerHTML=names().map((n,i)=>`<option value="${i}">${n}</option>`).join("");sel.value=pairIdx}
function divs(){return PAIRS[pairIdx].map(d=>d.flatMap(i=>Q[i].teams))}
function rr(teams){ // circle method, shuffled rounds
 let t=shuf(teams),n=t.length,rounds=[];
 for(let r=0;r<n-1;r++){const g=[];for(let i=0;i<n/2;i++)g.push([t[i],t[n-1-i]]);rounds.push(g);t.splice(1,0,t.pop())}
 return shuf(rounds)}
function build(){
 const [A,B]=divs(),ra=rr(A),rb=rr(B),weeks=[];
 for(let w=0;w<7;w++)weeks.push({games:[...ra[w],...rb[w]]});
 const b=shuf(B);weeks.push({fin:true,games:shuf(A).map((a,i)=>[a,b[i]])});
 sched=weeks;scores=null;render()}
function dv(t){return divs()[0].includes(t)?"A":"B"}
function render(){
 $("hint").innerHTML=editing?`<div class="hint">Editing quadrants: tap a team, then tap another team to swap them (or drag one onto another). Tap a quadrant name to rename it. Every quadrant always keeps 4 teams. Changes save automatically.${picked?`<br><b style="color:var(--a)">${picked} selected - now tap the team to swap with.</b>`:""}</div>`:"";
 $("edit").textContent=editing?"Done editing":"Edit quadrants";
 $("quads").innerHTML=Q.map((q,i)=>`<div class="q" style="border-top-color:${COL[i]}"><h3>${editing?`<span class="ren" data-q="${i}">${q.name}</span>`:q.name}</h3>${q.teams.map(t=>`<div class="t${editing?" e":""}${picked==t?" sel":""}" ${editing?`data-t="${t}" draggable="true"`:""}>${t}</div>`).join("")}</div>`).join("");
 if(editing){document.querySelectorAll(".t.e").forEach(el=>{const t=el.dataset.t;el.onclick=()=>pick(t);el.ondragstart=e=>{e.dataTransfer.setData("text/plain",t)};el.ondragover=e=>e.preventDefault();el.ondrop=e=>{e.preventDefault();const f=e.dataTransfer.getData("text/plain");if(f&&f!=t){swap(f,t);picked=null;save();fillSel();build()}}});
  document.querySelectorAll(".ren").forEach(el=>el.onclick=()=>{const i=+el.dataset.q,n=prompt("Quadrant name",Q[i].name);if(n&&n.trim()){Q[i].name=n.trim().slice(0,30);save();fillSel();render()}})}
 const [A,B]=divs(),nm=names()[pairIdx].split("  vs  ");
 $("divs").innerHTML=[["A",A,nm[0]],["B",B,nm[1]]].map(([k,d,n])=>`<div class="d ${k}"><h2>Division ${k}</h2><small>${n}</small><div style="margin-top:6px">${d.join(", ")}</div></div>`).join("");
 if(!sched)build0();
 $("weeks").innerHTML=sched.map((w,wi)=>`<div class="wk ${w.fin?"fin":""}"><h4>Week ${wi+1}${w.fin?" - Division vs Division finale":""}</h4><div class="g">${w.games.map((g,gi)=>{const s=scores&&scores[wi][gi];return `<span><span><b class="${dv(g[0])}">${g[0]}</b> vs <b class="${dv(g[1])}">${g[1]}</b></span><span class="sc">${s?s[0]+"-"+s[1]:""}</span></span>`}).join("")}</div></div>`).join("");
 $("stand").innerHTML=scores?standings():""}
function build0(){build()}
function simulate(){scores=sched.map(w=>w.games.map(()=>{let a=3+(Math.random()*8|0)*3+(Math.random()*3|0),b=3+(Math.random()*8|0)*3+(Math.random()*3|0);if(a==b)a+=3;return[a,b]}));render()}
function standings(){
 const rec={};divs().flat().forEach(t=>rec[t]={w:0,l:0,pf:0,pa:0});
 sched.forEach((w,wi)=>w.games.forEach((g,gi)=>{const[s1,s2]=scores[wi][gi];rec[g[0]].pf+=s1;rec[g[0]].pa+=s2;rec[g[1]].pf+=s2;rec[g[1]].pa+=s1;(s1>s2?(rec[g[0]].w++,rec[g[1]].l++):(rec[g[1]].w++,rec[g[0]].l++))}));
 const tbl=d=>`<table><tr><th>Team</th><th>W-L</th><th>PF-PA</th></tr>${d.slice().sort((x,y)=>rec[y].w-rec[x].w||(rec[y].pf-rec[y].pa)-(rec[x].pf-rec[x].pa)).map(t=>`<tr><td>${t}</td><td>${rec[t].w}-${rec[t].l}</td><td>${rec[t].pf}-${rec[t].pa}</td></tr>`).join("")}</table>`;
 const [A,B]=divs();
 return `<h2 class="s">Simulated standings</h2><div class="tw"><div class="d A"><h2>Division A</h2>${tbl(A)}</div><div class="d B"><h2>Division B</h2>${tbl(B)}</div></div>`}
$("sched").onclick=build;
$("sim").onclick=()=>{if(!sched)build();simulate()};
$("geo").onclick=()=>{Q=GEO.map(q=>({name:q[0],teams:q[1].slice()}));picked=null;save();fillSel();build()};
$("edit").onclick=()=>{editing=!editing;picked=null;render()};
$("redraw").onclick=()=>{const all=shuf(GEO.flatMap(q=>q[1]));Q=Q.map((q,i)=>({name:"Quadrant "+(i+1),teams:all.slice(i*4,i*4+4)}));picked=null;save();fillSel();build()};
sel.onchange=()=>{pairIdx=+sel.value;save();build()};
load();fillSel();build();
</script></body></html>
